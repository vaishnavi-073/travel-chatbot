<!DOCTYPE html>
<html>
<head>
<title>Travel Assistant</title>

<style>

body{
background:#f4f7fb;
font-family:Arial, Helvetica, sans-serif;
text-align:center;
margin:0;
padding:0;
}

.chatbox{
width:420px;
margin:50px auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0px 4px 12px rgba(0,0,0,0.1);
}

h2{
color:#2c3e50;
}

#chat{
height:350px;
overflow-y:auto;
background:#f9fbfd;
padding:15px;
border-radius:10px;
border:1px solid #e2e6ea;
margin-bottom:15px;
}

.user{
text-align:right;
background:#d6ecff;
color:#1a3c5a;
padding:8px 12px;
border-radius:10px;
margin:6px 0;
display:inline-block;
max-width:80%;
}

.bot{
text-align:left;
background:#e7f7ee;
color:#1b5e3c;
padding:8px 12px;
border-radius:10px;
margin:6px 0;
display:inline-block;
max-width:80%;
}

input{
width:68%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
outline:none;
}

button{
padding:10px 15px;
background:#4a90e2;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#357bd8;
}

</style>

</head>

<body>

<div class="chatbox">

<h2>🌍 Travel Assistant</h2>

<div id="chat">

<div class="bot">
👋 Hi! Welcome to Traveler Assistant.<br>
I can help you with destinations, travel tips, packing advice and more!
</div>

</div>

<input type="text" id="msg" placeholder="Ask about travel...">
<button onclick="sendMessage()">Send</button>

</div>


<script>

function sendMessage(){

let msg = document.getElementById("msg").value;

if(msg === "") return;

let chat = document.getElementById("chat");

chat.innerHTML += `<div class="user">${msg}</div>`;

fetch("/get",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"msg="+msg
})
.then(res=>res.json())
.then(data=>{

chat.innerHTML += `<div class="bot">${data}</div>`;

chat.scrollTop = chat.scrollHeight;

});

document.getElementById("msg").value="";

}

</script>

</body>
</html>
